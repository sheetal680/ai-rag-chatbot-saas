# Render deployment blueprint — https://render.com/docs/blueprint-spec
# Place this file at the repository root.
# On Render: New → Blueprint → connect repo → Render reads this file automatically.

services:
  - type: web
    name: ai-rag-chatbot-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon          # choose the region closest to your users
    plan: starter           # $7/month — always-on; free tier sleeps after 15 min

    healthCheckPath: /health

    envVars:
      # ── App ───────────────────────────────────────────────────────────────────
      - key: PORT
        value: "8000"
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO

      # ── LLM ───────────────────────────────────────────────────────────────────
      - key: LLM_PROVIDER
        value: auto                        # auto → Groq → Gemini → Ollama
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GEMINI_MODEL
        value: gemini-1.5-flash

      # ── Embeddings (local — no key needed) ───────────────────────────────────
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2

      # ── ChromaDB ──────────────────────────────────────────────────────────────
      - key: CHROMA_PERSIST_DIR
        value: /data/chroma_data           # matches disk.mountPath below
      - key: CHROMA_COLLECTION_NAME
        value: documents

      # ── Meta / WhatsApp (optional) ────────────────────────────────────────────
      - key: META_API_VERSION
        value: v19.0

      # Set these in the Render dashboard (sync: false = not committed to repo)
      - key: SECRET_KEY
        sync: false                        # openssl rand -hex 32
      - key: DATABASE_URL
        sync: false                        # Supabase direct URI + ?sslmode=require
      - key: GROQ_API_KEY
        sync: false                        # console.groq.com — free tier
      - key: GEMINI_API_KEY
        sync: false                        # aistudio.google.com — optional fallback
      - key: ALLOWED_ORIGINS
        sync: false                        # https://your-app.vercel.app (no trailing slash)
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false                        # any secret string you choose
      - key: META_APP_SECRET
        sync: false
      - key: META_WHATSAPP_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false

    # Persistent disk — survives deploys and restarts.
    # ChromaDB writes vector embeddings here. Without this, all documents
    # must be re-uploaded after every redeploy.
    disk:
      name: chroma-data
      mountPath: /data/chroma_data
      sizeGB: 1               # $0.25/month per GB on Render
