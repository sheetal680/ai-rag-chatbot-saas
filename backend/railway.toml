[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway polls this URL to decide if the deploy succeeded
healthcheckPath = "/health"
healthcheckTimeout = 60

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Set all required environment variables in the Railway dashboard.
# Required: SECRET_KEY, DATABASE_URL, GROQ_API_KEY, ALLOWED_ORIGINS
# Optional: GEMINI_API_KEY, LLM_PROVIDER, CHROMA_PERSIST_DIR, LOG_LEVEL, META_*
# Railway automatically injects: PORT
